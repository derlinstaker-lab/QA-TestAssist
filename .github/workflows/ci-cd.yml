name: QA Test Assist CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deployment target'
        required: true
        default: 'gh-pages'
        type: choice
        options:
          - gh-pages
          - s3
          - netlify

# Permissions for GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-dashboard-dist
          path: dist/
          retention-days: 7

      - name: Show build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat dist/build-manifest.json >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          find dist -type f | while read f; do
            size=$(du -sh "$f" | cut -f1)
            echo "| ${f#dist/} | $size |" >> $GITHUB_STEP_SUMMARY
          done

  # ──────────────────────────────────────────────
  deploy-gh-pages:
    name: Deploy → GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    # Manual only: the app needs the local dev server + Postgres, so a public
    # static deploy on every push gains nothing.
    if: >
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      && github.event_name == 'workflow_dispatch'
      && github.event.inputs.deploy_target == 'gh-pages'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: qa-dashboard-dist
          path: dist/

      - name: Deploy to GitHub Pages
        id: deploy
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          node scripts/deploy.js --target gh-pages

  # ──────────────────────────────────────────────
  deploy-s3:
    name: Deploy → AWS S3
    runs-on: ubuntu-latest
    needs: build
    if: >
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      && github.event_name == 'workflow_dispatch'
      && github.event.inputs.deploy_target == 's3'
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: qa-dashboard-dist
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to S3
        run: node scripts/deploy.js --target s3
        env:
          AWS_S3_BUCKET:         ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION:            ${{ secrets.AWS_REGION }}
          CF_DISTRIBUTION_ID:    ${{ secrets.CF_DISTRIBUTION_ID }}

  # ──────────────────────────────────────────────
  deploy-netlify:
    name: Deploy → Netlify
    runs-on: ubuntu-latest
    needs: build
    if: >
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      && github.event_name == 'workflow_dispatch'
      && github.event.inputs.deploy_target == 'netlify'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: qa-dashboard-dist
          path: dist/

      - name: Deploy to Netlify
        run: node scripts/deploy.js --target netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
